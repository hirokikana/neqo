[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neqo"
version = "0.1.1"
description = "Nimble Engine Query Orchestrator: unified queries and macros for Athena and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sql", "athena", "duckdb", "macros", "query"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Database"]
dependencies = ["jinja2>=3.1.6,<4", "PyYAML>=6,<7", "sqlglot>=26,<31", "typer>=0.15,<1", "prompt-toolkit>=3.0.48,<4", "rich>=13.9,<15"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.2,<2"]
athena = ["boto3>=1.35,<2"]
all = ["neqo[duckdb,athena]"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7", "duckdb>=1.2,<2", "boto3>=1.35,<2"]

[project.scripts]
neqo = "neqo.cli.main:main"

[project.urls]
Homepage = "https://github.com/hirokikana/neqo"
Repository = "https://github.com/hirokikana/neqo"
Issues = "https://github.com/hirokikana/neqo/issues"
Documentation = "https://github.com/hirokikana/neqo#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/neqo"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/docs", "/.github", "/pyproject.toml", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/uv.lock", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local engine integration", "aws: requires explicit live AWS configuration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
